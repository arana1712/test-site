<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Celebration</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="birthday-page">
    <section class="photo-sky" aria-label="Moving birthday memories">
      <div class="photo-track">
        <img src="assets/photos/photo1.jpeg" alt="Birthday memory photo 1" />
        <img src="assets/photos/photo2.jpeg" alt="Birthday memory photo 2" />
        <img src="assets/photos/photo3.jpeg" alt="Birthday memory photo 3" />
        <img src="assets/photos/photo4.jpeg" alt="Birthday memory photo 4" />
        <img src="assets/photos/photo5.jpeg" alt="Birthday memory photo 5" />
        <img src="assets/photos/photo6.jpeg" alt="Birthday memory photo 6" />
        <img src="assets/photos/photo7.jpeg" alt="Birthday memory photo 7" />
        <img src="assets/photos/photo8.jpeg" alt="Birthday memory photo 8" />
        <img src="assets/photos/photo9.jpeg" alt="Birthday memory photo 9" />
        <img src="assets/photos/photo10.jpeg" alt="Birthday memory photo 10" />
        <img src="assets/photos/photo11.jpeg" alt="Birthday memory photo 11" />
        <img src="assets/photos/photo12.jpeg" alt="Birthday memory photo 12" />
        <img src="assets/photos/photo13.jpeg" alt="Birthday memory photo 13" />
        <img src="assets/photos/photo14.jpeg" alt="Birthday memory photo 14" />
        <img src="assets/photos/photo15.jpeg" alt="Birthday memory photo 15" />
        <img src="assets/photos/photo16.jpeg" alt="Birthday memory photo 16" />
        <img src="assets/photos/photo17.jpeg" alt="Birthday memory photo 17" />
        <img src="assets/photos/photo18.jpeg" alt="Birthday memory photo 18" />
        <img src="assets/photos/photo19.jpeg" alt="Birthday memory photo 19" />

        <img src="assets/photos/photo1.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo2.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo3.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo4.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo5.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo6.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo7.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo8.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo9.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo10.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo11.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo12.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo13.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo14.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo15.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo16.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo17.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo18.jpeg" alt="" aria-hidden="true" />
        <img src="assets/photos/photo19.jpeg" alt="" aria-hidden="true" />

      </div>
    </section>

    <section class="hero">
      <p class="small-title">A little birthday surprise for you</p>
      <h1>Happy Birthday, Smiley!</h1>
      <p class="message">
        Wishing my love a year full of laughter, warm memories, sweet cake, and all the happiness you deserve.
      </p>

      <div class="controls" aria-label="Birthday actions">
        <button id="lightCandlesBtn" type="button">Light the candles ✨</button>
        <button id="cutCakeBtn" type="button">Cut the cake 🍰</button>
      </div>
      <p id="statusMessage" class="status-message" aria-live="polite"></p>
    </section>

    <section class="cake-stage" aria-label="Birthday cake">
      <div class="sparkles" aria-hidden="true"></div>
      <div id="cake" class="cake">
        <div class="candles">
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
        </div>
        <div class="cake-top">
          <span class="cream cream-1"></span>
          <span class="cream cream-2"></span>
          <span class="cream cream-3"></span>
        </div>
        <div class="cake-middle">
          <span class="sprinkle s1"></span>
          <span class="sprinkle s2"></span>
          <span class="sprinkle s3"></span>
          <span class="sprinkle s4"></span>
          <span class="sprinkle s5"></span>
        </div>
        <div class="cake-bottom"></div>
        <div class="plate"></div>
        <div class="slice" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>

</html>
